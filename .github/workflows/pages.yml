name: Deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout VevDB documentation
        uses: actions/checkout@v7
        with:
          repository: vevdb/vev
          ref: main
          path: _content/vev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install documentation builder
        run: npm ci

      - name: Test website tooling
        run: npm test

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp CNAME analytics-config.js analytics.js article.css docs.css index.html robots.txt style.css vev-mark.png vevdb.png _site/
          cp -R articles _site/
          node scripts/build-analytics-config.mjs --output _site/analytics-config.js
          node scripts/build-docs.mjs \
            --source _content/vev/docs \
            --output _site \
            --config docs.config.json
        env:
          POSTHOG_PROJECT_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          POSTHOG_API_HOST: ${{ vars.POSTHOG_API_HOST }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
